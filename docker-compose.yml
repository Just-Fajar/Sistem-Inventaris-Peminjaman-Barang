services:
  # Backend (Laravel) - Local Development & Testing Only
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inventaris-app
    restart: unless-stopped
    working_dir: /var/www
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - /var/www/vendor
      - /var/www/bootstrap/cache
      - ./docker/nginx/default.conf:/etc/nginx/sites-available/default
      - ./docker/supervisor/supervisord.conf:/etc/supervisor/conf.d/supervisord.conf
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_KEY=${APP_KEY:-base64:7K5pZ3z5U+W0J4vW9yZ3p5U+W0J4vW9yZ3p5U+W0J4w=}
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=inventaris
      - DB_USERNAME=root
      - DB_PASSWORD=secret
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QUEUE_CONNECTION=redis
      - CACHE_STORE=redis
      - CACHE_DRIVER=redis
      - SESSION_DRIVER=redis
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - inventaris-network

  # Frontend (React) - Local Development & Testing Only
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:8000/api
    container_name: inventaris-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - app
    networks:
      - inventaris-network

  # Database (MySQL 8.0)
  db:
    image: mysql:8.0
    container_name: inventaris-db
    restart: unless-stopped
    ports:
      - "${FORWARD_DB_PORT:-3307}:3306"
    environment:
      MYSQL_DATABASE: inventaris
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_PASSWORD: secret
      MYSQL_USER: inventaris
    volumes:
      - dbdata:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - inventaris-network

  # Redis (Cache & Queue)
  redis:
    image: redis:alpine
    container_name: inventaris-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - inventaris-network

  # PhpMyAdmin (Optional - for local DB inspection)
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: inventaris-phpmyadmin
    restart: unless-stopped
    ports:
      - "${FORWARD_PMA_PORT:-8081}:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: secret
    depends_on:
      - db
    networks:
      - inventaris-network

volumes:
  dbdata:
    driver: local
  redisdata:
    driver: local

networks:
  inventaris-network:
    driver: bridge
